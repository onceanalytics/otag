<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>otag test site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #111; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #666; margin-bottom: 32px; }
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    label { font-size: 14px; font-weight: 500; }
    input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
    button { padding: 10px 20px; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #333; }
    .actions { display: flex; gap: 8px; margin-bottom: 32px; }
    .actions button { background: #f5f5f5; color: #111; border: 1px solid #ddd; }
    .actions button:hover { background: #eee; }
    #log { font-family: ui-monospace, monospace; font-size: 12px; background: #f8f8f8; border: 1px solid #eee; border-radius: 6px; padding: 16px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .log-name { color: #0a0; font-weight: 600; }
  </style>
</head>
<body>
  <h1>otag test site</h1>
  <p>Open this file directly &mdash; no server needed. Requests are intercepted and shown below instead of being sent.</p>

  <form id="signup-form">
    <label>Name</label>
    <input type="text" name="name" value="Jane Doe">
    <label>Email</label>
    <input type="email" name="email" value="jane@example.com">
    <button type="submit">Sign up</button>
  </form>

  <div class="actions">
    <button onclick="dataLayer.push({ event: 'purchase', value: 49.99, currency: 'USD', transaction_id: 'tx_123' })">
      Push purchase event
    </button>
    <button onclick="dataLayer.push({ event: 'add_to_cart', value: 19.99, item_id: 'sku_456' })">
      Push add_to_cart
    </button>
    <button onclick="undefinedFunction()">
      Trigger JS error
    </button>
  </div>

  <h2 style="font-size: 16px; margin-bottom: 8px;">Event log</h2>
  <div id="log">Waiting for events...</div>

  <script>
    // Swallow the requests and render them instead. Must be installed before
    // otag loads, since otag sends its first page_view immediately.
    const logEl = document.getElementById('log');
    let first = true;

    navigator.sendBeacon = function (_url, data) { logEvent(data); return true; };
    window.fetch = function (_url, opts) {
      if (opts && opts.body) logEvent(opts.body);
      return Promise.resolve(new Response('{}'));
    };

    function logEvent(data) {
      try {
        const obj = JSON.parse(data);
        if (first) { logEl.textContent = ''; first = false; }
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString();
        entry.innerHTML = `<span class="log-name">${obj.e}</span> ${time}\n${JSON.stringify(obj, null, 2)}\n`;
        logEl.prepend(entry);
      } catch {}
    }

    // Form submit → dataLayer
    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      dataLayer.push({
        event: 'generate_lead',
        email: fd.get('email'),
        name: fd.get('name')
      });
    });
  </script>

  <script src="../dist/otag.js"></script>
</body>
</html>
